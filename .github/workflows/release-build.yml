name: Build release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional. If set (e.g. v1.0), the APKs are also attached to a GitHub pre-release with this tag. Leave empty to only get downloadable artifacts.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    # If the project was uploaded from a zip, submodule folders are empty.
    - name: Ensure hev-socks5-tunnel source is present
      run: |
        if [ -z "$(ls -A hev-socks5-tunnel 2>/dev/null)" ]; then
          echo "hev-socks5-tunnel is empty or missing, cloning it"
          rm -rf hev-socks5-tunnel
          git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel hev-socks5-tunnel
        else
          echo "hev-socks5-tunnel is present"
        fi

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        GRADLE_FILE="${{ github.workspace }}/V2rayNG/app/build.gradle.kts"
        if ! grep -q 'ndkVersion' "$GRADLE_FILE"; then
          sed -i '/^android {/a\    ndkVersion = "30.0.16248370"' "$GRADLE_FILE"
        fi
        grep -n 'ndkVersion' "$GRADLE_FILE" || { echo "ERROR: ndkVersion was not set in build.gradle.kts"; exit 1; }

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Detect AndroidLibXrayLite tag
      run: |
        TAG=""
        if [ -e AndroidLibXrayLite/.git ]; then
          TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0 2>/dev/null || true)
        fi
        echo "Detected AndroidLibXrayLite tag: '${TAG}'"
        echo "LIB_TAG=${TAG}" >> $GITHUB_ENV

    - name: Download libv2ray (matching tag)
      if: env.LIB_TAG != ''
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.LIB_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Download libv2ray (latest release fallback)
      if: env.LIB_TAG == ''
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        latest: true
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    # Needs the four repository secrets: APP_KEYSTORE_BASE64, APP_KEYSTORE_PASSWORD,
    # APP_KEYSTORE_ALIAS, APP_KEY_PASSWORD
    - name: Decode Keystore
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Build signed release APK
      shell: bash
      working-directory: V2rayNG
      run: |
        set -o pipefail
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreRelease --console=plain \
          -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} \
          -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }} \
          2>&1 | tee ../build.log

    - name: List and verify APKs
      if: always()
      run: |
        find V2rayNG/app/build/outputs/apk -name '*.apk' -exec ls -lh {} \; 2>/dev/null || echo "no APKs found"
        for f in $(find V2rayNG/app/build/outputs/apk -name '*arm64-v8a*.apk' 2>/dev/null | head -1); do
          echo "Signature of $f:"
          $ANDROID_HOME/build-tools/37.0.0/apksigner verify --print-certs "$f" || true
        done

    - name: Upload arm64-v8a APK
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: release-arm64-v8a
        path: V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk
        if-no-files-found: warn

    - name: Upload universal APK
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: release-universal
        path: V2rayNG/app/build/outputs/apk/*/release/*universal*.apk
        if-no-files-found: warn

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: release-build-log
        path: build.log
        if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          pattern: release-*
          merge-multiple: true

      - name: Show files
        run: ls -lh release

      - name: Attach APKs to a pre-release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release/*.apk
          tag: ${{ inputs.release_tag }}
          file_glob: true
          prerelease: true
